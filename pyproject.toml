[project]
name = "mswe-rl-env"
version = "0.2.0"
description = "Turn mini-swe-agent into an RL rollout environment: token-level trajectories, sandboxed verifiable rewards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mini-swe-agent",
    "requests>=2.31",
    "pyyaml>=6.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Local inference server (Apple Silicon MPS / CPU / CUDA)
infer = [
    "torch>=2.4",
    "transformers>=4.51",
    "huggingface_hub[cli]>=0.34",
    "pyarrow>=15",  # mswe-make-humanevalfix reads the dataset's Parquet file
]

# Apple MLX inference (Apple Silicon only)
mlx = [
    "mlx-lm>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub[cli]>=0.34",
    "pyarrow>=15",  # mswe-make-humanevalfix reads the dataset's Parquet file
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",
    "ruff==0.16.9",
]

[project.scripts]
mswe-infer = "mswe_rl.infer_server:main"
mswe-proxy = "mswe_rl.proxy:main"
mswe-rollout = "mswe_rl.rollout:main"
mswe-inspect = "mswe_rl.inspect_samples:main"
mswe-verify-logprobs = "mswe_rl.verify_logprobs:main"
mswe-check-tasks = "mswe_rl.check_tasks:main"
mswe-make-humanevalfix = "mswe_rl.humanevalfix:main"
mswe-report = "mswe_rl.report:main"

[tool.uv.sources]
mini-swe-agent = { path = "third_party/mini-swe-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mswe_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["third_party", "tasks"]  # tasks/ holds intentionally buggy code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]  # E501: the formatter owns line length
