[project]
name = "mswe-rl-env"
version = "0.1.0"
description = "Turn mini-swe-agent into an RL rollout environment: token-level trajectories, sandboxed verifiable rewards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mini-swe-agent",
    "requests>=2.31",
    "pyyaml>=6.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Local inference server (Apple Silicon MPS / CPU / CUDA)
infer = [
    "torch>=2.4",
    "transformers>=4.51",
    "huggingface_hub[cli]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",
]

[project.scripts]
mswe-infer = "mswe_rl.infer_server:main"
mswe-proxy = "mswe_rl.proxy:main"
mswe-rollout = "mswe_rl.rollout:main"
mswe-inspect = "mswe_rl.inspect_samples:main"

[tool.uv.sources]
mini-swe-agent = { path = "third_party/mini-swe-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mswe_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
